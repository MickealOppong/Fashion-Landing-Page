<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Address Book</title>
  <link rel="stylesheet" href="./src/css/index.css" />
  <link rel="stylesheet" href="./src/css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
  <!--start Nav-->
  <nav class="nav">
    <div class="nav-center ">
      <div class="nav-logo">
        <a href="/" class="logo">
          <p>leverX</p>
          <h1>employee services</h1>
        </a>
      </div>
      <div class="nav-menu">
        <a href="/" data-id="link" class="address-book"><span>Address Book</span></a>
      </div>
      <div class="nav-user">
        <div class="support-btn-container">
          <i class="fa fa-question-circle"></i>
          <button class="support-btn"><span>support</span></button>
        </div>
        <div class="user">
          <div class="user-icon" data-id="link">
            <img src="./src/assets/Unknown.png" alt="image" class="profile-image">
            <p class="username"></p>
          </div>
        </div>
        <div class="power-btn-container">
          <button class="power-btn"><i class="fa fa-power-off"></i></button>
        </div>
      </div>
      <div class="btn-container">
        <button class="hamburger-btn"><i class="fa  fa-bars"></i></button>
        <button class="close-btn"><i class="fa  fa-times"></i></button>
      </div>
    </div>
    <div class="search-container">
      <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="search" name="search" id="search" class="search-input" placeholder="Open search panel">
      </div>
    </div>
  </nav>
  <!--end NAV-->

  <div id="app"></div>

</body>
<script src="./dist/index.js" type="module"></script>

</html>
